<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动量轮动策略跟踪</title>
<style>
  :root {
    --bg: #0f1420; --card: #182032; --card2: #1e2840; --line: #2a3550;
    --text: #d5dbe7; --dim: #8a94a8; --accent: #4f8cff;
    --up: #e54545; --down: #2ebd6e;   /* A股习惯: 红涨绿跌 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 16px; max-width: 1280px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 20px; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button, select, input[type=date], input[type=number] { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=number] { cursor: text; width: 110px; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  #controls .grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #controls .grp { min-width: 0; max-width: 100%; }
  #controls select { min-width: 0; max-width: 100%; }
  #controls .lbl { color: var(--dim); font-size: 12px; }
  #banner { display: none; background: #3a2f10; border: 1px solid #8a6d1f; color: #ffd97a; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
  #versionInfo, #shadowCard { margin-bottom: 12px; }
  #versionInfo { border-left: 3px solid var(--accent); }
  .context-line { color: var(--dim); font-size: 12px; line-height: 1.7; }
  .context-warning { color: #ffd97a; font-size: 12px; line-height: 1.7; }
  #shadowGrid { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: baseline; }
  #shadowGrid strong { font-size: 17px; color: #61d2ba; }
  #shadowCard .badge { margin-left: 8px; background: #123a35; color: #61d2ba; }
  #stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat .k { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .stat .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .up { color: var(--up); } .down { color: var(--down); }
  #chart { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 12px; }
  #chartDiv { width: 100%; height: 480px; }
  #tables { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  @media (max-width: 900px) { #tables { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; }
  .panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  th { color: var(--dim); font-weight: 400; text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #1c2438; font-variant-numeric: tabular-nums; }
  .scroll { max-height: 420px; overflow-y: auto; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .b-轮动 { background: #26314e; color: #9db2dd; }
  .b-建仓 { background: #123a5e; color: #6db3ff; }
  .b-恐慌抄底 { background: #4a1626; color: #ff7d9c; }
  .b-避险停靠 { background: #3a3a10; color: #e6d97a; }
  .b-一致 { background: #123a2a; color: #5fd99a; }
  .b-偏离 { background: #3a2f10; color: #ffd97a; }
  #ledger { margin-bottom: 12px; }
  #ledgerGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { #ledgerGrid { grid-template-columns: 1fr; } }
  #ledgerStatus .big { font-size: 17px; font-weight: 600; }
  #ledgerStatus .s { color: var(--dim); font-size: 12px; }
  #ledgerForm { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #ledgerMsg { font-size: 12px; margin-top: 8px; display: none; }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  #err { color: #ff7d7d; font-size: 13px; padding: 8px 0; display: none; }
</style>
</head>
<body>
<header>
  <h1>动量轮动策略跟踪</h1>
  <span class="meta" id="metaInfo">加载中…</span>
  <span class="spacer"></span>
  <button id="btnRefresh">⟳ 重建数据</button>
</header>

<div id="banner">⏳ 正在重建回测缓存（全量约 3 分钟），完成后自动刷新…</div>
<div id="err"></div>

<div id="controls">
  <div class="grp"><span class="lbl">版本</span><select id="selVersion"></select></div>
  <div class="grp"><span class="lbl">对比</span><select id="selCompare"></select></div>
  <div class="grp" id="quickBtns">
    <button data-q="3m">近3月</button><button data-q="6m">近6月</button>
    <button data-q="ytd">今年</button><button data-q="1y">近1年</button>
    <button data-q="3y">近3年</button><button data-q="all" class="active">全部</button>
  </div>
  <div class="grp">
    <input type="date" id="inpStart"> <span class="lbl">~</span> <input type="date" id="inpEnd">
  </div>
  <div class="grp"><label class="lbl"><input type="checkbox" id="chkLog" checked> 对数轴</label></div>
</div>

<div class="panel" id="versionInfo" aria-live="polite"></div>

<div id="stats"></div>

<div class="panel" id="shadowCard" aria-live="polite">
  <h2>V10-H 独立影子账户 <span class="badge">研究观察 · 不下单</span></h2>
  <div id="shadowContent" class="context-line">正在读取保存状态；历史回测净值不作为前向净值。</div>
</div>

<div id="chart"><div id="chartDiv"></div></div>

<div class="panel" id="ledger">
  <h2>实盘账本（独立于上方研究回测） <span class="meta">记账自下一信号周期(交易日14:50)起生效 · 同 <code>record.py</code></span>
    <button id="btnLedgerReload" style="float:right" title="刷新账本">⟳</button></h2>
  <div id="ledgerGrid">
    <div>
      <div id="ledgerStatus">加载中…</div>
      <div id="ledgerForm"></div>
      <div id="ledgerMsg"></div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px">最近记账</div>
      <div class="scroll" style="max-height:170px"><table id="tblLedger">
        <thead><tr><th>时间</th><th>动作</th><th>标的</th><th>价格</th><th>份数</th><th>金额</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </div>
</div>

<div id="tables">
  <div class="panel"><h2>历史模型换仓记录 <span class="meta" id="tradeCount"></span></h2>
    <div class="scroll"><table id="tblTrades">
      <thead><tr><th>日期</th><th>类型</th><th>卖出</th><th>买入</th><th>当时净值</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
  <div class="panel"><h2>逐年收益</h2>
    <div class="scroll"><table id="tblYearly">
      <thead><tr><th>年份</th><th id="yh1">本版本</th><th id="yh2" style="display:none">对比</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</div>

<script src="/static/echarts.min.js"></script>
<script>
/* 标的色板(与策略池一致) */
const POOL_COLORS = {
  "159915": "#e54545", "588080": "#e67e22", "510300": "#3498db", "510500": "#9b59b6",
  "563300": "#1abc9c", "512400": "#f1c40f", "512890": "#95a5a6", "513100": "#2ebd6e",
  "513120": "#e91e63", "518880": "#ffd700", "511880": "#5d6b80"
};
const VERSION_COLORS = {
  "v10-h": "#61d2ba", "v9.2-tr": "#c49bff", "v9.2": "#4f8cff",
  "v9.1": "#ffb454", "v9": "#84a7d8"
};
const state = { version: "v10-h", compare: "v9.2-tr", start: null, end: null, log: true,
                quick: "all", range: null, meta: null, series: null };
let chart = null, pollTimer = null, seriesRequest = 0;

const $ = s => document.querySelector(s);
const finite = v => typeof v === "number" && Number.isFinite(v);
const fmtPct = v => (!finite(v) ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%");
const fmtNum = (v, places=2) => finite(v) ? v.toFixed(places) : "—";
const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g,
  c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const textList = value => Array.isArray(value) ? value.filter(Boolean) : (value ? [value] : []);
const versionMeta = id => ((state.meta || {}).versions || []).find(v => v.id === id) || {};
const versionColor = (id, fallback="#4f8cff") => VERSION_COLORS[id] || fallback;
const cls = v => v == null ? "" : (v >= 0 ? "up" : "down");

function addMonths(d, m) {
  const dt = new Date(d + "T00:00:00Z"); dt.setUTCMonth(dt.getUTCMonth() + m);
  return dt.toISOString().slice(0, 10);
}

function applyQuick(q) {
  state.quick = q;
  const last = state.range[1], first = state.range[0];
  if (q === "all") { state.start = null; state.end = null; }
  else if (q === "ytd") { state.start = last.slice(0, 4) + "-01-01"; state.end = null; }
  else { const m = {"3m": -3, "6m": -6, "1y": -12, "3y": -36}[q];
         state.start = addMonths(last, m) < first ? first : addMonths(last, m); state.end = null; }
  document.querySelectorAll("#quickBtns button").forEach(b =>
    b.classList.toggle("active", b.dataset.q === q));
  $("#inpStart").value = state.start || ""; $("#inpEnd").value = "";
  loadSeries();
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 503) { showBuilding(); throw {building: true}; }
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
}

function showBuilding() {
  $("#banner").style.display = "block";
  if (!pollTimer) pollTimer = setInterval(async () => {
    try {
      const m = await api("/api/meta");
      if (m.ready && !m.building) { clearInterval(pollTimer); pollTimer = null;
        $("#banner").style.display = "none"; await loadMeta(); loadSeries(); }
    } catch (e) { /* 仍在构建 */ }
  }, 5000);
}

function syncVersionRange() {
  const current = versionMeta(state.version);
  const range = current.data_range || (state.meta || {}).data_range;
  if (!Array.isArray(range) || range.length !== 2) throw new Error("版本数据范围缺失");
  state.range = range;
  ["#inpStart", "#inpEnd"].forEach(selector => {
    $(selector).min = range[0]; $(selector).max = range[1];
  });
  $("#metaInfo").textContent = `${current.label || state.version} · 历史数据 ${range[0]} ~ ${range[1]}` +
    (state.meta.built_at ? ` · 缓存构建于 ${state.meta.built_at}` : "") +
    (state.meta.building ? " · ⏳ 后台重建中" : "");
}

async function loadMeta() {
  const m = await api("/api/meta");
  state.meta = m;
  const versions = m.versions || [];
  if (!versions.length) throw new Error("暂无可用版本");
  if (!versions.some(v => v.id === state.version)) {
    state.version = versions.some(v => v.id === "v10-h") ? "v10-h" :
      (versions.some(v => v.id === "v9.2") ? "v9.2" : versions[0].id);
  }
  const sv = $("#selVersion"), sc = $("#selCompare");
  sv.innerHTML = ""; sc.innerHTML = "";
  versions.forEach(v => {
    const annual = (v.metrics || {}).ann;
    const suffix = finite(annual) ? ` · 历史年化 ${fmtPct(annual)}` : "";
    sv.appendChild(new Option(`${v.label}${suffix}`, v.id));
  });
  sc.appendChild(new Option("无", ""));
  versions.forEach(v => sc.appendChild(new Option(v.label, v.id)));
  (m.benchmarks || []).forEach(b => sc.appendChild(new Option(b.label, b.id)));
  const available = [...versions, ...(m.benchmarks || [])].map(v => v.id);
  if (!available.includes(state.compare) || state.compare === state.version) {
    const preferred = versionMeta(state.version).default_compare;
    state.compare = preferred && available.includes(preferred) ? preferred : "";
  }
  sv.value = state.version; sc.value = state.compare;
  syncVersionRange();
  if (m.signal) renderShadow(m.signal);
  if (m.building) showBuilding();
}

function renderVersionInfo(s) {
  const meta = s.version_meta || versionMeta(state.version);
  const range = meta.data_range || state.range || s.range;
  const bases = {
    corrected_total_return_close: "校正总回报收盘数据",
    corrected_tr_same_close: "校正总回报 · 理想同收盘成交",
    legacy_qfq_same_close: "旧版前复权 · 同收盘成交",
    legacy_qfq_close: "旧版前复权收盘数据",
    legacy_qfq: "旧版前复权数据"
  };
  const basis = bases[meta.basis] || meta.basis || "历史数据（以版本说明为准）";
  const kinds = {frozen_research:"冻结研究回测", research_backtest:"研究回测",
    frozen_control:"冻结同口径对照", legacy_backtest:"旧版历史回测", legacy:"旧版历史回测"};
  const kind = kinds[meta.kind] || (state.version === "v10-h" ? "冻结研究回测" :
    (state.version === "v9.2-tr" ? "冻结同口径对照" : "历史模型回测"));
  const warnings = textList(meta.warnings);
  if (s.comparison_warning) warnings.unshift(s.comparison_warning);
  $("#versionInfo").style.borderLeftColor = versionColor(state.version);
  $("#versionInfo").innerHTML = `<h2>${esc(s.label)} · ${esc(kind)}</h2>
    <div class="context-line">数据口径：${esc(basis)} · 历史截止 ${esc(range[1])}</div>
    <div class="context-line">收益、曲线与区间末持仓均为历史研究结果，不代表当前实盘或下方影子账户业绩。</div>
    ${meta.metrics_note ? `<div class="context-line">${esc(meta.metrics_note)}</div>` : ""}
    ${warnings.map(note => `<div class="context-warning">${esc(note)}</div>`).join("")}`;
}

function renderShadow(signal) {
  const el = $("#shadowContent");
  if (!signal) {
    el.innerHTML = '<div class="context-warning">尚未取得V10-H保存状态；不使用回测曲线推定今日持仓或前向净值。</div>';
    return;
  }
  const labels = {not_started: "尚未启动", active: "最新有效影子记录", stale: "历史影子记录（非当前建议）",
                  failed: "本次信号不可用", historical_preview: "历史预览 · 前向跟踪尚未启动"};
  const current = signal.status === "active" && signal.actionable !== false;
  const status = signal.status === "active" && !current ? "当日保存记录（非当前操作建议）" : (labels[signal.status] || "保存状态待核验");
  const target = current ? (signal.target || signal.holding) : signal.holding;
  const targetLabel = current ? "影子目标" : "上次影子持仓";
  const targetText = target && target.code ? `${target.code} ${target.name || ""}` : "—";
  const recordedNav = signal.start_date && signal.state_date && finite(signal.nav) &&
    !["not_started", "historical_preview"].includes(signal.status);
  const navText = recordedNav ? signal.nav.toFixed(4) : "—";
  const notes = textList(signal.warnings);
  const delivery = {sent:"已确认送达", uncertain:"送达未确认", sending:"发送结果待确认", failed:"推送失败",
                    rejected:"推送被拒绝", pending:"待推送", expired:"推送窗口已过", missing:"暂无送达记录"};
  const generation = {ready:"已生成", running:"生成中", failed:"生成失败", missing:"暂无生成记录"};
  const deliveryText = signal.delivery_status ? (delivery[signal.delivery_status] || "送达状态待核验") : "暂无送达记录";
  const generationText = signal.generation_status ? (generation[signal.generation_status] || "生成状态待核验") : "暂无生成记录";
  el.innerHTML = `<div id="shadowGrid"><span>${esc(status)}</span>
    <span>${targetLabel}：<strong>${esc(targetText)}</strong></span>
    <span>${current ? "独立虚拟净值" : "上次记录净值"}：<strong>${navText}</strong>${recordedNav ? `（自 ${esc(signal.start_date)} 从1起算）` : ""}</span></div>
    <div class="context-line">信号数据日期 ${esc(signal.data_date || "—")} · 行情时间 ${esc(signal.quote_timestamp || "—")} · 账户记录日期 ${esc(signal.state_date || "—")}</div>
    <div class="context-line">${esc(generationText)} · ${esc(deliveryText)}</div>
    ${signal.reason ? `<div class="context-line">${esc(signal.reason)}</div>` : ""}
    ${signal.preview && signal.preview.code ? `<div class="context-warning">历史预览 ${esc(signal.preview.date || "—")}：<strong>${esc(signal.preview.code)} ${esc(signal.preview.name || "")}</strong>，非今日买入指令；不计入前向账户。</div>` : ""}
    ${notes.map(note => `<div class="context-warning">${esc(note)}</div>`).join("")}
    <div class="context-line">前向净值从首次有效信号以1起算；独立影子不下单，也不与上方历史回测净值拼接。</div>`;
}

function segColor(code) { return POOL_COLORS[code] || "#888"; }

function renderStats(s) {
  const m = s.metrics || {}, h = s.holding || {}, names = s.names || {};
  const cmp = s.compare ? ` <span class="s">vs ${esc(s.compare.label)} ${fmtPct((s.compare.metrics || {}).total_ret)}</span>` : "";
  $("#stats").innerHTML = `
    <div class="stat"><div class="k">历史区间收益 ${esc(s.range[0])}~${esc(s.range[1])}</div>
      <div class="v ${cls(m.total_ret)}">${fmtPct(m.total_ret)}</div>${cmp}</div>
    <div class="stat"><div class="k">历史年化</div><div class="v ${cls(m.ann)}">${fmtPct(m.ann)}</div></div>
    <div class="stat"><div class="k">最大回撤</div><div class="v down">${fmtNum(m.max_dd)}%</div></div>
    <div class="stat"><div class="k">夏普</div><div class="v">${fmtNum(m.sharpe)}</div></div>
    <div class="stat"><div class="k">区间换手</div><div class="v">${s.trades.filter(t=>t[4]!=="建仓").length} 次</div></div>
    <div class="stat"><div class="k">区间末历史模型持仓</div>
      <div class="v">${h.code ? `<span class="legend-dot" style="background:${segColor(h.code)}"></span>${esc(names[h.code] || h.code)} <span class="s">${esc(h.code)}</span>` : "未持仓"}</div>
      <div class="s">截至 ${esc(s.range[1])}；${esc(h.since || "—")} 起 ${esc(h.days == null ? "—" : h.days)} 个交易日 · <span class="${cls(h.pnl)}">${fmtPct(h.pnl)}</span></div></div>`;
}

function renderChart(s) {
  const daily = s.daily, n = daily.length;
  if (!n) throw new Error("选定区间没有历史数据");
  const base = finite(s.normalization_base) && s.normalization_base > 0 ? s.normalization_base : daily[0][1];
  const dates = daily.map(r => r[0]);
  const norm = daily.map(r => r[1] / base);
  const navIdx = {}; daily.forEach((r, i) => navIdx[r[0]] = i);

  /* 回撤序列 */
  let peak = 1;
  const dd = norm.map(v => { peak = Math.max(peak, v); return +((v / peak - 1) * 100).toFixed(2); });

  /* 持仓分段 -> markArea */
  const areas = [];
  let segStart = 0;
  for (let i = 1; i <= n; i++) {
    if (i === n || daily[i][2] !== daily[segStart][2]) {
      const code = daily[segStart][2];
      areas.push([{ xAxis: dates[segStart], itemStyle: { color: segColor(code) + "14" } },
                  { xAxis: dates[i - 1] }]);
      segStart = i;
    }
  }

  /* 换仓点 */
  const dots = s.trades.filter(t => navIdx[t[0]] != null).map(t => ({
    coord: [t[0], +(daily[navIdx[t[0]]][1] / base).toFixed(4)],
    itemStyle: { color: segColor(t[2]), borderColor: "#fff", borderWidth: 1 },
    trade: t
  }));

  /* 按API给定基期归一；旧版缺基期时继续以首个观测点为1。 */
  const series = [{
    name: s.label, type: "line", data: norm, showSymbol: false,
    lineStyle: { width: 2, color: versionColor(state.version) }, itemStyle: { color: versionColor(state.version) },
    markArea: { silent: true, data: areas }, z: 3
  }, {
    name: "换仓点", type: "scatter", data: dots, symbolSize: 9, z: 5,
    label: { show: false }
  }, {
    name: "回撤", type: "line", data: dd, xAxisIndex: 1, yAxisIndex: 1,
    showSymbol: false, lineStyle: { width: 1, color: "#e54545" },
    areaStyle: { color: "#e5454533" }, itemStyle: { color: "#e54545" }
  }];
  if (s.compare && s.compare.daily && s.compare.daily.length) {
    const cb = s.compare.daily;
    const cbase = finite(s.compare.normalization_base) && s.compare.normalization_base > 0 ? s.compare.normalization_base : cb[0][1];
    const cmap = {}; cb.forEach(r => cmap[r[0]] = r[1] / cbase);
    series.splice(1, 0, {
      name: s.compare.label, type: "line", showSymbol: false,
      data: dates.map(d => cmap[d] != null ? +cmap[d].toFixed(4) : null),
      lineStyle: { width: 1.5, color: versionColor(state.compare, "#f1c40f"), type: "dashed" }, itemStyle: { color: versionColor(state.compare, "#f1c40f") },
      connectNulls: true, z: 2
    });
  }

  const opt = {
    backgroundColor: "transparent",
    animation: false,
    grid: [
      { left: 60, right: 16, top: 30, height: "58%" },
      { left: 60, right: 16, top: "72%", height: "18%" }
    ],
    axisPointer: { link: [{ xAxisIndex: "all" }] },
    legend: { top: 4, textStyle: { color: "#8a94a8" },
              data: series.filter(x => ["line"].includes(x.type) && x.name !== "回撤").map(x => x.name) },
    tooltip: {
      trigger: "axis", backgroundColor: "#1e2840", borderColor: "#2a3550",
      textStyle: { color: "#d5dbe7", fontSize: 12 },
      formatter: ps => {
        const i = navIdx[ps[0].axisValue];
        if (i == null) return "";
        const code = daily[i][2];
        let html = `<b>${esc(dates[i])}</b> 历史模型持仓 ${esc(s.names[code] || code || "空仓")}<br>`;
        ps.forEach(p => {
          if (p.seriesName === "换仓点" || p.seriesName === "回撤") return;
          if (p.value == null) return;
          const ret = (p.value - 1) * 100;
          html += `${p.marker}${esc(p.seriesName)}: 归一净值 ${p.value.toFixed(3)} (${ret >= 0 ? "+" : ""}${ret.toFixed(1)}%)<br>`;
        });
        html += `<span style="color:#e54545">回撤 ${dd[i].toFixed(1)}%</span>`;
        return html;
      }
    },
    xAxis: [
      { type: "category", data: dates, axisLine: { lineStyle: { color: "#2a3550" } },
        axisLabel: { color: "#8a94a8" } },
      { type: "category", data: dates, gridIndex: 1, show: false }
    ],
    yAxis: [
      { type: state.log ? "log" : "value", scale: true, name: "净值(归一)",
        nameTextStyle: { color: "#8a94a8" }, splitLine: { lineStyle: { color: "#1c2438" } },
        axisLabel: { color: "#8a94a8" } },
      { type: "value", gridIndex: 1, max: 0, name: "回撤%",
        nameTextStyle: { color: "#8a94a8" }, splitLine: { show: false },
        axisLabel: { color: "#8a94a8", formatter: "{value}" } }
    ],
    dataZoom: [{ type: "inside", xAxisIndex: [0, 1] }],
    series
  };
  if (!chart) chart = echarts.init($("#chartDiv"));
  chart.setOption(opt, true);
}

function renderTables(s) {
  $("#tradeCount").textContent = `区间内 ${s.trades.length} 条`;
  const tb = document.querySelector("#tblTrades tbody");
  tb.innerHTML = s.trades.slice().reverse().map(t => {
    const [d, frm, to, nav, kind, fname, tname] = t;
    return `<tr><td>${d}</td><td><span class="badge b-${kind}">${kind}</span></td>
      <td>${frm ? `<span class="legend-dot" style="background:${segColor(frm)}"></span>${fname}` : "—"}</td>
      <td><span class="legend-dot" style="background:${segColor(to)}"></span>${tname}</td>
      <td>${nav.toFixed(3)}</td></tr>`;
  }).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--dim)">区间内无换仓</td></tr>`;

  const yb = document.querySelector("#tblYearly tbody");
  const cmpYears = s.compare && s.compare.yearly ? Object.fromEntries(s.compare.yearly) : null;
  $("#yh1").textContent = s.label;
  $("#yh2").textContent = s.compare ? s.compare.label : "对比";
  $("#yh2").style.display = cmpYears ? "" : "none";
  yb.innerHTML = s.yearly.map(([y, r]) => {
    const c = cmpYears && cmpYears[y] != null ?
      `<td class="${cls(cmpYears[y])}">${fmtPct(cmpYears[y])}</td>` :
      (cmpYears ? "<td>—</td>" : "");
    const lastYear = String(y) === s.range[1].slice(0, 4);
    const yearLabel = lastYear ? `${y}（截至${s.range[1].slice(5)}）` : y;
    return `<tr><td>${esc(yearLabel)}</td><td class="${cls(r)}">${fmtPct(r)}</td>${c}</tr>`;
  }).join("");
}

async function loadSeries() {
  const request = ++seriesRequest;
  $("#err").style.display = "none";
  try {
    const p = new URLSearchParams({ version: state.version });
    if (state.compare) p.set("compare", state.compare);
    if (state.start) p.set("start", state.start);
    if (state.end) p.set("end", state.end);
    const s = await api("/api/series?" + p);
    if (request !== seriesRequest) return;
    state.series = s;
    renderVersionInfo(s); renderShadow(s.signal || (state.meta || {}).signal);
    renderStats(s); renderChart(s); renderTables(s);
    loadLedger();
  } catch (e) {
    if (request !== seriesRequest || e.building) return;
    $("#err").textContent = "加载失败: " + e.message + (state.series ? "；下方仍为上次成功加载的 " + state.series.label + " 历史结果。" : "");
    $("#err").style.display = "block";
  }
}

/* ---- 实盘账本(record.py 网页入口) ---- */
const LEDGER = { data: null, fetched: 0 };

function ledgerMsg(text, isErr) {
  const el = $("#ledgerMsg");
  el.textContent = text;
  el.style.color = isErr ? "#ff7d7d" : "#5fd99a";
  el.style.display = "block";
}

async function recordApi(body) {
  const r = await fetch("/api/record", {
    method: "POST",
    headers: { "Content-Type": "application/json",
               "X-Token": localStorage.getItem("stock_web_token") || "" },
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403) throw { needToken: true, message: j.error || "需要访问令牌" };
  if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

async function doRecord(action, code, price, amount) {
  if (!/^\d{6}$/.test(code || "")) return ledgerMsg("请先手动选择有效标的", true);
  price = parseFloat(price);
  if (!(price > 0)) return ledgerMsg("请填写有效价格", true);
  if (action === "buy" && !(parseFloat(amount) > 0)) return ledgerMsg("请填写有效金额", true);
  const nm = ((LEDGER.data || {}).names || {})[code] || code;
  const msg = action === "buy"
    ? `确认买入 ${code} ${nm}?\n价格 ${price} × 金额 ${amount} 元\n(record.py 规则: 按100份取整, 全仓语义)`
    : `确认卖出全部 ${code} ${nm}?\n价格 ${price}`;
  if (!confirm(msg)) return;
  const body = { action, code, price };
  if (action === "buy") body.amount = parseFloat(amount);
  try {
    const r = await recordApi(body);
    ledgerMsg("✓ " + (r.out || "已记账") + " · 自下一信号周期(交易日14:50)起生效");
    loadLedger(true);
  } catch (e) {
    if (e.needToken) {
      const t = prompt("服务端要求访问令牌, 请输入(将保存在本浏览器):",
                       localStorage.getItem("stock_web_token") || "");
      if (t != null) { localStorage.setItem("stock_web_token", t.trim());
                       return doRecord(action, code, price, amount); }
      return;
    }
    ledgerMsg("✗ 记账失败: " + e.message, true);
  }
}

function modelBadge(pf, names) {
  return '<span class="badge b-轮动">独立实盘账本 · 不与历史回测仓位判定偏离</span>';
}

function renderLedger(d) {
  const pf = d.portfolio || {}, names = d.names || {}, q = d.quotes || {};
  let html;
  if (pf.holding) {
    const cur = q[pf.holding];
    const pnl = cur && pf.cost ? (cur / pf.cost - 1) * 100 : null;
    const mv = cur ? pf.shares * cur : null;
    html = `<div class="big">${names[pf.holding] || pf.holding} <span class="meta">${pf.holding}</span> ${modelBadge(pf, names)}</div>
      <div class="s" style="margin-top:6px">${pf.shares} 份 · 成本 ${(+pf.cost).toFixed(3)} (${pf.entry_date || "-"}) · 现价 ${cur ? cur.toFixed(3) : "—"} · 市值 ${mv != null ? mv.toFixed(0) : "—"} 元 · 浮盈 <span class="${cls(pnl)}">${fmtPct(pnl)}</span></div>
      <div class="s" style="margin-top:4px">现金 ${(pf.cash || 0).toFixed(0)} 元 · 累计已实现盈亏 ${(pf.realized || 0).toFixed(0)} 元</div>`;
  } else {
    html = `<div class="big">空仓 ${modelBadge(pf, names)}</div>
      <div class="s" style="margin-top:6px">现金 ${(pf.cash || 0).toFixed(0)} 元 · 累计已实现盈亏 ${(pf.realized || 0).toFixed(0)} 元</div>`;
  }
  $("#ledgerStatus").innerHTML = html;

  const f = $("#ledgerForm");
  if (pf.holding) {
    f.innerHTML = `
      <span class="lbl">卖出 ${names[pf.holding] || pf.holding}(全部)</span>
      <input type="number" id="sellPrice" step="0.001" min="0" placeholder="卖出价">
      <button type="button" id="btnFillPrice">取现价</button>
      <button type="button" id="btnDoSell" style="border-color:var(--down);color:var(--down)">确认卖出</button>`;
    if (q[pf.holding]) $("#sellPrice").value = q[pf.holding].toFixed(3);
    $("#btnFillPrice").onclick = () => { if (q[pf.holding]) $("#sellPrice").value = q[pf.holding].toFixed(3); };
    $("#btnDoSell").onclick = () => doRecord("sell", pf.holding, $("#sellPrice").value);
  } else {
    const opts = Object.keys(names).map(c => `<option value="${c}">${c} ${names[c]}</option>`).join("");
    f.innerHTML = `
      <span class="lbl">买入(全仓语义)</span>
      <select id="buyCode">${opts}</select>
      <input type="number" id="buyPrice" step="0.001" min="0" placeholder="买入价">
      <input type="number" id="buyAmount" step="1000" min="0" placeholder="金额(元)" style="width:130px">
      <button type="button" id="btnFillPrice">取现价</button>
      <button type="button" id="btnDoBuy" style="border-color:var(--up);color:var(--up)">确认买入</button>`;
    const fill = () => { const p = q[$("#buyCode").value]; $("#buyPrice").value = p ? p.toFixed(3) : ""; };
    // History/preview targets must never prefill a real-account buy form.
    $("#buyCode").insertAdjacentHTML("afterbegin", '<option value="">请手动选择标的</option>');
    $("#buyCode").value = "";
    $("#btnFillPrice").onclick = fill;
    $("#buyCode").onchange = fill;
    $("#btnDoBuy").onclick = () => doRecord("buy", $("#buyCode").value, $("#buyPrice").value, $("#buyAmount").value);
  }

  const tb = document.querySelector("#tblLedger tbody");
  tb.innerHTML = (d.recent_trades || []).map(r =>
    `<tr><td>${r[0]}</td><td>${r[1] === "buy" ? '<span class="up">买入</span>' : '<span class="down">卖出</span>'}</td>
     <td>${r[3] || r[2]}</td><td>${(+r[4]).toFixed(3)}</td><td>${r[5]}</td><td>${(+r[6]).toFixed(0)}</td></tr>`
  ).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--dim)">暂无记账记录</td></tr>`;
}

async function loadLedger(force) {
  if (!force && LEDGER.data && Date.now() - LEDGER.fetched < 15000)
    return renderLedger(LEDGER.data);   // 15s 内重渲染即可, 不重复拉行情
  try {
    const d = await api("/api/portfolio");
    LEDGER.data = d; LEDGER.fetched = Date.now();
    renderLedger(d);
  } catch (e) {
    if (e.building) return;
    $("#ledgerStatus").innerHTML = `<span style="color:#ff7d7d">账本加载失败: ${e.message}</span>`;
  }
}

$("#selVersion").addEventListener("change", e => {
  state.version = e.target.value;
  const preferred = versionMeta(state.version).default_compare || (state.version === "v10-h" ? "v9.2-tr" : "");
  state.compare = Array.from($("#selCompare").options).some(o => o.value === preferred) ? preferred : "";
  $("#selCompare").value = state.compare;
  syncVersionRange();
  if (state.quick) applyQuick(state.quick);
  else {
    if (state.start) state.start = state.start < state.range[0] ? state.range[0] : (state.start > state.range[1] ? state.range[1] : state.start);
    if (state.end) state.end = state.end < state.range[0] ? state.range[0] : (state.end > state.range[1] ? state.range[1] : state.end);
    $("#inpStart").value = state.start || ""; $("#inpEnd").value = state.end || "";
    loadSeries();
  }
});
$("#selCompare").addEventListener("change", e => { state.compare = e.target.value; loadSeries(); });
$("#chkLog").addEventListener("change", e => { state.log = e.target.checked;
  if (state.series) renderChart(state.series); });
document.querySelectorAll("#quickBtns button").forEach(b =>
  b.addEventListener("click", () => applyQuick(b.dataset.q)));
$("#inpStart").addEventListener("change", e => {
  state.start = e.target.value || null; state.quick = "";
  document.querySelectorAll("#quickBtns button").forEach(b => b.classList.remove("active"));
  loadSeries(); });
$("#inpEnd").addEventListener("change", e => {
  state.end = e.target.value || null; state.quick = "";
  document.querySelectorAll("#quickBtns button").forEach(b => b.classList.remove("active"));
  loadSeries(); });
$("#btnRefresh").addEventListener("click", async () => {
  await api("/api/refresh", { method: "POST" }); showBuilding();
});
$("#btnLedgerReload").addEventListener("click", () => loadLedger(true));
window.addEventListener("resize", () => chart && chart.resize());

(async () => { try { await loadMeta(); applyQuick("all"); } catch (e) {
  if (!e.building) { $("#err").textContent = "初始化失败: " + e.message;
    $("#err").style.display = "block"; } } })();
</script>
</body>
</html>
